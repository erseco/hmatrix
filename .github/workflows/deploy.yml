name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for an automatic Dependabot merge
        id: gate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then exit 0; fi
          for ((attempt = 0; attempt < 60; attempt++)); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'if .user.login != "dependabot[bot]" then "skip" elif .merged then "merged" elif .state == "closed" or .auto_merge == null then "skip" else "waiting" end')
            if [ "$state" = merged ]; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = skip ]; then exit 0; fi
            sleep 5
          done
          echo "Timed out waiting for the Dependabot merge" >&2
          exit 1
      - name: Check out source
        if: github.event_name != 'workflow_run' || steps.gate.outputs.merged == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Set up Node.js
        if: github.event_name != 'workflow_run' || steps.gate.outputs.merged == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and local vision assets
        if: github.event_name != 'workflow_run' || steps.gate.outputs.merged == 'true'
        run: npm ci
      - name: Test
        if: github.event_name != 'workflow_run' || steps.gate.outputs.merged == 'true'
        run: npm test
      - name: Build
        if: github.event_name != 'workflow_run' || steps.gate.outputs.merged == 'true'
        run: npm run build
      - name: Configure Pages
        if: github.event_name != 'workflow_run' || steps.gate.outputs.merged == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload production site
        if: github.event_name != 'workflow_run' || steps.gate.outputs.merged == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy
        if: github.event_name != 'workflow_run' || steps.gate.outputs.merged == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
